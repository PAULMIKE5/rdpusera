services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: globalrdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: globalrdp
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalrdp"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
